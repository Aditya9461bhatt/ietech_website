<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="i.e tech - Realising Industry 4.0 in real-world industries through AI, software, and intelligent hardware engineering." />
  <meta name="keywords"
    content="AI, Industry 4.0, Hardware Engineering, Software Engineering, Smart ERP, HRMS, Enterprise Solutions" />
  <title>i.e tech | Industry 4.0 Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <script>
    (() => {
      try {
        const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        
        const applyTheme = (isDark) => {
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        };

        applyTheme(mediaQuery.matches);

        // Listen for OS theme changes
        mediaQuery.addEventListener('change', (e) => {
          applyTheme(e.matches);
        });
      } catch {
        // No-op
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
